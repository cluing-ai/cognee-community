[project]
name = "cognee-community-connector-gitlab"
version = "0.1.0"
description = "GitLab data-source connector for cognee — sync a project's issues and merge requests (with comments) into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Document-mode dlt sources (DOCUMENT_SOURCE_ATTR routing) shipped in cognee
    # 1.4.0; 1.6.x is the current release the Docker image is built from.
    "cognee>=1.6.0,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_gitlab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
